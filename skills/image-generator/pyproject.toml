[project]
name = "image-generator-skill"
version = "0.2.0"
description = "Optional, Entra-only Azure image authoring with strict native dimensions and auditable manifests."
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "azure-identity>=1.25.3,<2",
    "httpx>=0.28.1,<1",
    "pillow>=10.4,<13",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
generate-images = "image_generator.cli:main"

[build-system]
requires = ["setuptools>=75.8.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "microsoft"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true
