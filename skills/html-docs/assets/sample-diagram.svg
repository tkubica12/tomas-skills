<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="A source feeds processing, which writes to a sink.">
  <style>
    .box { fill: #f2f2f2; stroke: #565656; }
    .text { fill: #161616; }
    .line { stroke: #565656; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #232323; stroke: #b5b5b5; }
      .text { fill: #f2f2f2; }
      .line { stroke: #b5b5b5; }
    }
    text { font: 28px system-ui, sans-serif; text-anchor: middle; }
  </style>
  <g class="box" stroke-width="2">
    <rect x="20" y="60" width="220" height="120" rx="12"/>
    <rect x="370" y="60" width="220" height="120" rx="12"/>
    <rect x="720" y="60" width="220" height="120" rx="12"/>
  </g>
  <g class="line" fill="none" stroke-width="3">
    <path d="M240 120 H350 M334 110 L350 120 L334 130"/>
    <path d="M590 120 H700 M684 110 L700 120 L684 130"/>
  </g>
  <g class="text">
